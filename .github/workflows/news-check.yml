name: news-check
# یه بار چک دستی خبرها (برای عیب‌یابی؛ لاگش فوری دیده میشه). چک دائمی کار news-tick هست.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "اکانت‌های X رو همین الان هم چک کن (بدون صبر)"
        type: boolean
        default: true
      probe:
        description: "عیب‌یابی: آدرس یه صفحه‌ی خبر"
        default: ""
      redo:
        description: "این خبرها از نو ساخته بشن (کلمه‌های تیتر با | جدا)"
        default: ""
      clear_jobs:
        description: "کارهای عکسِ گیرکرده رو پاک کن"
        type: boolean
        default: false
      recover:
        description: "خبرهای مهم ۳ روز اخیر که ساخته نشدن رو برگردون"
        type: boolean
        default: false
      diagnose:
        description: "فقط گزارش (خبرهای الان هر فید و امتیازشون؛ چیزی تغییر نمی‌کنه)"
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check news once
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: python serverless_agent.py ${{ inputs.probe != '' && format('--probe "{0}"', inputs.probe) || '' }} ${{ inputs.redo != '' && format('--redo "{0}"', inputs.redo) || '' }} ${{ inputs.clear_jobs && '--clear-jobs' || '' }} ${{ inputs.recover && '--recover' || (inputs.diagnose && '--diagnose' || '--tick') }} ${{ inputs.force && '--force' || '' }}
